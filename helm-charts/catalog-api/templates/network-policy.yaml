apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-db-isolation
spec:
  podSelector:
    # Selecciona los pods creados por el chart oficial de postgresql
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Solo permite tráfico entrante si viene de los pods de NUESTRA API
    - podSelector:
        matchLabels:
          app: catalog-api
    ports:
    - protocol: TCP
      port: 5432
      